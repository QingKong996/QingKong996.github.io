baseURL: "https://qingkong996.com/"
theme: ["PaperMod"]

# --- 全局基础配置 ---
defaultContentLanguage: zh
hasCJKLanguage: true
enableRobotsTXT: true

# --- 语言专项配置 ---
languages:
  # 简体中文
  zh:
    languageCode: zh-cn
    languageName: "简体中文"
    contentDir: content/zh
    weight: 1
    title: "QingKong996"
    params:
      description: "QingKong996 的个人博客。"
      keywords:
        - "QingKong996"
        - "开发实践"
        - "工具折腾"
        - "编程博客"
        - "Hugo"
      languageAltTitle: "简体中文"
      mainSections: ["posts"]
      homeInfoParams:
        Title: "QingKong996"
        Content: "25级人工智能本科生。"
      seo:
        homeTitle: "QingKong996's Blog"
        homeDescription: "QingKong996 的个人博客。"
      editPost:
        URL: "https://github.com/QingKong996/QingKong996.github.io/tree/main/content/zh"
        Text: "改进这篇文章"
        appendFilePath: true
    menu:
      main:
        - name: "分类"
          url: "categories"
          weight: 10
        - name: "标签"
          url: "tags"
          weight: 20
        - name: "归档"
          url: "archives"
          weight: 30

  # 英文
  en:
    languageCode: en
    languageName: "English"
    contentDir: content/en
    weight: 2
    title: "QingKong996"
    params:
      description: "QingKong996's personal blog."
      keywords:
        - "QingKong996"
        - "development practice"
        - "developer blog"
        - "tooling"
        - "Hugo"
      languageAltTitle: "English"
      mainSections: ["posts"]
      homeInfoParams:
        Title: "QingKong996"
        Content: "An undergraduate student majoring in Artificial Intelligence, class of 2025."
      seo:
        homeTitle: "QingKong996's Blog"
        homeDescription: "QingKong996's personal blog."
      editPost:
        URL: "https://github.com/QingKong996/QingKong996.github.io/tree/main/content/en"
        Text: "Improve this post"
        appendFilePath: true
    menu:
      main:
        - name: "Categories"
          url: "categories"
          weight: 10
        - name: "Tags"
          url: "tags"
          weight: 20
        - name: "Archives"
          url: "archives"
          weight: 30

# --- 通用参数 (所有语言共享) ---
params:
  author: "QingKong996"
  description: "QingKong996 的个人博客。"
  keywords:
    - "QingKong996"
    - "Developer Blog"
    - "Programming"
    - "Tooling"
    - "Hugo"
  displayFullLangName: true
  math: true
  schema:
    publisherType: "Person"
    sameAs:
      - "https://github.com/QingKong996"
      - "https://x.com/QingKong007"

  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  ShowReadingTime: true
  ShowToc: true
  ShowBreadCrumbs: true

  assets:
    theme_color: "#151c2b"
    msapplication_TileColor: "#151c2b"

  editPost:
    appendFilePath: true

  contentLicense:
    name: "CC BY-NC-SA 4.0"
    url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"

  socialIcons:
    - name: "x"
      url: "https://x.com/QingKong007"
    - name: "github"
      url: "https://github.com/QingKong996"
    - name: "email"
      url: "mailto:qingkong996@gmail.com"
      title: "Gmail"

markup:
  goldmark:
    extensions:
      strikethrough: false
      extras:
        delete:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
      passthrough:
        enable: true
        delimiters:
          block:
            - ['$$', '$$']
          inline:
            - ['$', '$']
    renderer:
      unsafe: true
